<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Red de estaciones meteorológicas de Villastar y la vega del Turia (Teruel) en tiempo real" />
    <title>Meteostar</title>
    <script>
      // Aplica el último tema usado antes de pintar la página (evita el parpadeo); después se ajusta al de la cuenta
      try {
        var t = localStorage.getItem("tema");
        var oscuros = { oscuro: 1, noche: 1, bosque: 1, contraste: 1 };
        if (t && t !== "auto") document.documentElement.setAttribute("data-theme", t);
        if (oscuros[t]) document.documentElement.setAttribute("data-modo", "oscuro");
      } catch (e) {}
    </script>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'><rect width='40' height='40' rx='6' fill='%23d99a25'/><path fill='%23151a3d' d='M20 7.5L23.3 16.5L32.8 16.8L25.3 22.7L27.9 31.9L20 26.6L12.1 31.9L14.7 22.7L7.2 16.8L16.7 16.5Z'/></svg>" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
