<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Red de estaciones meteorológicas de Villastar y la vega del Turia (Teruel) en tiempo real" />
    <title>Meteostar</title>
    <script>
      // Aplica el último tema usado antes de pintar la página (evita el parpadeo); después se ajusta al de la cuenta
      try {
        var t = localStorage.getItem("tema");
        var oscuros = { oscuro: 1, noche: 1, bosque: 1, contraste: 1 };
        if (t && t !== "auto") document.documentElement.setAttribute("data-theme", t);
        if (oscuros[t]) document.documentElement.setAttribute("data-modo", "oscuro");
      } catch (e) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Aplicación instalable (PWA) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#151a3d" />
    <link rel="apple-touch-icon" href="/iconos/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Meteostar" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
